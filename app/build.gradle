plugins { id 'com.android.application' }
android {
    namespace 'com.simon.offlinebms'
    compileSdk 35
    defaultConfig { applicationId 'com.simon.offlinebms'; minSdk 31; targetSdk 35; versionCode 14; versionName '1.2.9'; testInstrumentationRunner 'com.simon.offlinebms.LocalDataTests' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    buildTypes { release { minifyEnabled false } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'bms.fixtureDir', file('../tests/fixtures').absolutePath
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
